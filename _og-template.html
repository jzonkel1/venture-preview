<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Archivo:wght@600;700;800;900&family=Yellowtail&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  .og{width:1200px;height:630px;position:relative;overflow:hidden;
    background:radial-gradient(135% 115% at 72% 36%,#FAF3E2 0%,#EAD1A7 44%,#E2C79A 100%);
    font-family:'Archivo',system-ui,sans-serif;border-bottom:8px solid #0A2742}
  /* mid-century atomic sunburst (matches the hero) */
  .sun{position:absolute;top:50%;left:48%;width:820px;height:820px;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 6deg at 50% 50%,#0A5A64 0 1.1deg,transparent 1.1deg 12deg);
    opacity:.09;
    -webkit-mask-image:radial-gradient(closest-side,#000 6%,rgba(0,0,0,.55) 38%,transparent 76%);
    mask-image:radial-gradient(closest-side,#000 6%,rgba(0,0,0,.55) 38%,transparent 76%)}
  /* team illustration on the right, feathered into the parchment.
     Two registered layers (same source canvas): bg plate + Glenn foreground —
     matches the site's current floating hero. */
  .photo{position:absolute;top:0;right:0;bottom:0;width:60%}
  .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:42% 30%;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 17%);
    mask-image:linear-gradient(90deg,transparent 0,#000 17%)}
  .left{position:absolute;left:78px;top:0;bottom:0;width:560px;z-index:2;
    display:flex;flex-direction:column;justify-content:center;gap:6px}
  .left .logo{width:392px;height:auto;display:block;margin-left:-6px}
  .script{font-family:'Yellowtail',cursive;color:#B6452E;font-size:62px;line-height:.92;
    transform:rotate(-2.5deg);transform-origin:left center;margin:14px 0 22px 4px}
  .kick{display:flex;align-items:center;gap:13px;font-weight:800;text-transform:uppercase;
    letter-spacing:.11em;font-size:16px;color:#0A5A64;margin-left:4px;white-space:nowrap}
  .kick::before{content:"";width:34px;height:3px;background:#B6452E}
  .phone{font-family:'Bevan',Georgia,serif;color:#0B3A6E;font-size:52px;line-height:1;margin:16px 0 0 4px}
  .phone span{color:#B6452E}
  /* Google 5.0 review pill — social proof on shared links */
  .gpill{display:inline-flex;align-items:center;gap:10px;margin:20px 0 0 4px;align-self:flex-start;
    background:#FAF3E2;border:3px solid #0A2742;border-radius:999px;padding:9px 20px;box-shadow:4px 4px 0 #C9A14A}
  .gpill svg{width:26px;height:26px;flex:none}
  .gpill b{font-size:24px;color:#0B3A6E}
  .gpill .stars{color:#FBBC04;font-size:22px;letter-spacing:2px}
  .gpill .cnt{font-weight:700;font-size:17px;color:#5a6168}
</style>
</head>
<body>
  <div class="og">
    <div class="sun"></div>
    <div class="photo">
      <img src="/venture-preview/hero-bg-plate.webp" alt="" />
      <img src="/venture-preview/hero-foreground.webp" alt="" />
    </div>
    <div class="left">
      <img class="logo" src="/venture-preview/logo.png" alt="Venture Plumbing" />
      <div class="script">for every adventure!</div>
      <div class="kick">Licensed Master Plumber &middot; Rockport, TX</div>
      <div class="phone">361&#8209;<span>229&#8209;5728</span></div>
      <div class="gpill">
        <svg viewBox="0 0 48 48"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34A21.99 21.99 0 0 0 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>
        <b>5.0</b><span class="stars">★★★★★</span><span class="cnt">Google reviews</span>
      </div>
    </div>
  </div>

<style>#leadPop{display:none!important}
.pv-bar{position:fixed;top:0;left:0;right:0;z-index:9999;background:#B6452E;color:#fff;text-align:center;
font:700 13px/1.3 system-ui,sans-serif;padding:7px 12px;letter-spacing:.02em}
body{margin-top:30px}</style>
<div class="pv-bar">PREVIEW for review. Not live yet; the sign-up form is turned off here.</div>
<script>document.addEventListener('submit',function(e){e.preventDefault();
alert('Preview only: sign-ups go live once the page is published.');},true);</script>
</body>
</html>
